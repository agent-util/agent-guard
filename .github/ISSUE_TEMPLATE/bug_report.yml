name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: textarea
    id: reproduction
    attributes:
      {
        label: Reproduction,
        description: Include version,
        platform,
        configuration with secrets removed,
        and minimal steps.,
      }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
