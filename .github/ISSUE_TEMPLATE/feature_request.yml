name: Feature request
description: Propose a capability without overstating enforcement
body:
  - type: textarea
    id: problem
    attributes: { label: Problem and use case }
    validations: { required: true }
  - type: textarea
    id: security
    attributes:
      {
        label: Security and enforcement model,
        description: State what this can and cannot prevent.,
      }
    validations: { required: true }
