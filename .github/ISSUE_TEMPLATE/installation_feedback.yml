name: Installation feedback
description: Report where first-time setup was confusing or failed.
title: "[Installation]: "
labels: ["installation-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Agent Guard without maintainer assistance. Do not include credentials, source code, or sensitive filesystem paths.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, package manager, and agent integration.
      placeholder: macOS 15, Node.js 22, npm 10, Cursor
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Installed and verified without help
        - Installed but needed documentation or external help
        - Could not complete installation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps attempted
      description: Paste the commands you used and remove any sensitive values.
      placeholder: |
        npm install --save-dev @agent-utils/agent-guard
        npx agent-guard init
        npx agent-guard adapters install cursor
    validations:
      required: true
  - type: textarea
    id: confusion
    attributes:
      label: What was confusing?
      description: Identify the first unclear instruction, unexpected result, or missing prerequisite.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would have helped?
      description: Suggest wording, an example, an error message, or a workflow improvement.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, private source code, and sensitive paths from this report.
          required: true
